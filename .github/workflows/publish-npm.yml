# Required secret (GitHub → Settings → Secrets → Actions):
#   NPM_TOKEN — npm automation token with publish rights to the @axion org scope.

name: Publish TypeScript SDK to npm

on:
  push:
    tags:
      - 'sdk-ts-v*'   # e.g. sdk-ts-v1.0.0 — any other tag is ignored

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axion-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"        # e.g. sdk-ts-v1.2.3
          VERSION="${TAG#sdk-ts-v}"       # strip prefix → 1.2.3
          npm version "$VERSION" --no-git-tag-version

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

version: "3.9"

services:
  axion-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: axion-server:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - AXION_API_KEY=${AXION_API_KEY:-}
    volumes:
      - axion-missions:/app/missions
      - axion-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  axion-missions:
  axion-uploads:

[package]
name = "axion-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "axion_core"
path = "src/lib.rs"

[[bin]]
name = "axion"
path = "src/main.rs"

[dependencies]
# Async runtime for the Dispatcher
tokio = { version = "1", features = ["full"] }
rand = "0.8"
async-trait = "0.1"

# Wasm execution host
wasmtime     = "28"
wasmtime-wasi = "28"
bytes        = "1"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Serialization for the Axion Protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for OpenAI API
reqwest = { version = "0.12", features = ["json"] }

# Unique IDs for tasks and agents
uuid = { version = "1.6", features = ["v4", "serde"] }

# Load environment variables from .env file
dotenvy = "0.15"

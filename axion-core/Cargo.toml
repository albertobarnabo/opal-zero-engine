[package]
name = "axion-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "axion_core"
path = "src/lib.rs"

[[bin]]
name = "axion"
path = "src/main.rs"

[dependencies]
# Async runtime for the Dispatcher
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rand = "0.8"
async-trait = "0.1"

# Wasm execution host
wasmtime     = "28"
wasmtime-wasi = "28"
bytes        = "1"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Serialization for the Axion Protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for OpenAI API
reqwest = { version = "0.12", features = ["json"] }

# Unique IDs for tasks and agents
uuid = { version = "1.6", features = ["v4", "serde"] }

# Load environment variables from .env file
dotenvy = "0.15"

# Structured logging
tracing = "0.1"

# Embedded SQLite for the sqlite_query tool
rusqlite = { version = "0.31", features = ["bundled"] }

# CSV parsing for the read_csv tool
csv = "1.3"

# RSS/Atom feed parsing for the rss_reader tool
feed-rs = "2"

# Text diffing for the diff tool
similar = "2"

# PDF text extraction for the extract_pdf_text tool
pdf-extract = "0.7"

# Email sending for the send_email tool
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
